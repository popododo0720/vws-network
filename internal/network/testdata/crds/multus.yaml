# Minimal stand-in for the Multus NetworkAttachmentDefinition CRD with its real
# names (plural network-attachment-definitions, as RBAC sees it). The schema
# accepts any spec. The Kube-OVN CRDs are the real ones in kubeovn-v1.16.12.yaml.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: network-attachment-definitions.k8s.cni.cncf.io
spec:
  group: k8s.cni.cncf.io
  scope: Namespaced
  names:
    kind: NetworkAttachmentDefinition
    listKind: NetworkAttachmentDefinitionList
    plural: network-attachment-definitions
    singular: network-attachment-definition
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
