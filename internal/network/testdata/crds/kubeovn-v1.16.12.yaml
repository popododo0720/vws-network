              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              autoCreateVlanSubinterfaces:
                description: Automatically create VLAN subinterfaces
                type: boolean
              customInterfaces:
                description: Custom interface configurations for specific nodes
                items:
                  properties:
                    interface:
                      description: Interface name
                      maxLength: 15
                      pattern: ^[^/\s]+$
                      type: string
                    nodes:
                      description: Nodes that use this custom interface
                      items:
                        type: string
                      type: array
                  type: object
                type: array
              defaultInterface:
                description: Default interface name for the provider network. This
                  field is immutable after creation.
                maxLength: 15
                pattern: ^[^/\s]+$
                type: string
              exchangeLinkName:
                description: Exchange link name between host and container
                type: boolean
              excludeNodes:
                description: Nodes to exclude from this provider network
                items:
                  type: string
                type: array
              nodeSelector:
                description: Node selector for targeting specific nodes
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              preserveVlanInterfaces:
                description: Enable automatic detection and preservation of VLAN interfaces
                type: boolean
              vlanInterfaces:
                description: Optional explicit list of VLAN interface names to preserve
                  (e.g., eth0.10, bond0.20)
                items:
                  type: string
                type: array
            required:
            - defaultInterface
            type: object
          status:
            properties:
              conditions:
                description: |-
                  Conditions represents the latest state of the object
