                      format: date-time
                      type: string
                    lastUpdateTime:
                      description: Last time the condition was probed
                      format: date-time
                      type: string
                    message:
                      description: A human readable message indicating details about
                        the transition.
                      type: string
                    node:
                      description: Node name
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9,
                        the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: The reason for the condition's last transition.
                      type: string
                    status:
                      description: Status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: Type of condition.
                      type: string
                  type: object
                type: array
              notReadyNodes:
                description: Nodes that are not ready
                items:
                  type: string
                type: array
              ready:
                description: Whether the provider network is ready
                type: boolean
              readyNodes:
                description: Nodes that are ready
                items:
                  type: string
                type: array
              vlans:
                description: VLANs in use by this provider network
                items:
                  type: string
                type: array
            type: object
