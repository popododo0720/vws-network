name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vendored vws-lib
        run: VWS_LIB_OFFLINE=1 scripts/vendor-lib.sh check
      - name: test
        run: go test -race ./...
      - name: envtest
        env:
          CGO_ENABLED: "1"
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.2
          KUBEBUILDER_ASSETS="$(setup-envtest use 1.37.0 -p path)"
          export KUBEBUILDER_ASSETS
          go test -race -tags envtest -count=1 ./internal/network

  # Common golangci-lint baseline (vws-deploy .github/golangci-common.yml, vws-deploy#300).
  # fetch-depth 0 gives new-from-merge-base the origin/main history it compares against.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: guard-agents.sh rejects bad inputs
        run: scripts/guard-agents.sh selftest
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-only: true
      - name: Lint
        run: golangci-lint run --timeout=5m ./...
      - name: Format (gofumpt, goimports)
        run: golangci-lint fmt --diff

  # /correct loop guard (vws-deploy#448). Runs here, not in repo-guard.yml, which must stay
  # the pinned vws-deploy caller (vws-deploy docs/design/repo-guard-reusable.md).
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AGENTS.md has the /correct loop, incident form and label (vws-deploy#448)
        run: scripts/guard.sh correct
      - name: guard.sh fails on an empty /correct loop section
        run: scripts/guard_test.sh
