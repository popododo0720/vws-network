name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vendored vws-lib
        run: VWS_LIB_OFFLINE=1 scripts/vendor-lib.sh check
      - name: test
        run: go test ./...
      - name: envtest
        env:
          CGO_ENABLED: "0"
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.2
          export KUBEBUILDER_ASSETS="$(setup-envtest use 1.37.0 -p path)"
          go test -tags envtest -count=1 ./internal/network
      - name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          args: --timeout=5m
