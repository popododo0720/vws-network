name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vendored vws-lib
        run: VWS_LIB_OFFLINE=1 scripts/vendor-lib.sh check
      - name: test
        run: go test ./...
      - name: envtest
        env:
          CGO_ENABLED: "0"
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.25.2
          export KUBEBUILDER_ASSETS="$(setup-envtest use 1.37.0 -p path)"
          go test -tags envtest -count=1 ./internal/network

  # Common golangci-lint baseline (vws-deploy lint/golangci-common.yml, vws-deploy#300).
  # fetch-depth 0 gives new-from-merge-base the origin/main history it compares against.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: guard-agents.sh rejects bad inputs
        run: scripts/guard-agents.sh selftest
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-only: true
      - name: Lint
        run: golangci-lint run --timeout=5m ./...
      - name: Format (gofumpt, goimports)
        run: golangci-lint fmt --diff
