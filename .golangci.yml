version: "2"
linters:
  enable:
    - errorlint
    - misspell
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party/
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/popododo0720/vws-network
  exclusions:
    generated: lax
    paths:
      - third_party/
