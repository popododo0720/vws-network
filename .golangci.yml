version: "2"
linters:
  enable:
    - bodyclose
    - contextcheck
    - errcheck
    - errname
    - errorlint
    - misspell
    - nilerr
    - nilnil
    - noctx
    - sloglint
    - wrapcheck
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    wrapcheck:
      ignore-package-globs:
        - github.com/popododo0720/vws-network/internal/*
        - google.golang.org/grpc/status
        - google.golang.org/grpc/internal/status
    sloglint:
      no-mixed-args: true
      attr-only: true
      context: all
      static-msg: true
      key-naming-case: snake
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - wrapcheck
    presets:
      - comments
      - common-false-positives
      - legacy
    paths:
      - third_party/
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/popododo0720/vws-network
  exclusions:
    generated: lax
    paths:
      - third_party/
