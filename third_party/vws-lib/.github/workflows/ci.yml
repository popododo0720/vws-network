name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: guard-agents.sh rejects bad inputs
        run: scripts/guard-agents.sh selftest
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
      - name: check-imports.sh rejects forbidden imports
        run: scripts/check-imports.sh selftest
      - name: no dependency on vws-proto or a service repo
        run: scripts/check-imports.sh

  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
      - name: check-consumer.sh fails when the lib breaks
        run: scripts/check-consumer.sh selftest
      - name: sample consumer module builds against the lib
        run: scripts/check-consumer.sh

  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: vendor-lib.sh rejects edited, moved, and forged copies
        run: scripts/vendor-lib.sh selftest
      - name: vendor-proto.sh rejects untagged, edited, moved and forged copies
        run: scripts/vendor-proto.sh selftest

  # English only: tracked files (with .github/english-allowlist), the PR body and the PR's commit messages.
  english:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check-english.sh rejects bad inputs
        run: scripts/check-english.sh selftest
      - name: Tracked files are English
        run: scripts/check-english.sh files
      - name: PR body is English
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: scripts/check-english.sh text
      - name: Commit messages are English
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-english.sh commits "$BASE_SHA" "$HEAD_SHA"
