// TODO: temporary. This file moves to the shared VWS proto repository.
syntax = "proto3";

package vws.network.v1;

option go_package = "github.com/popododo0720/vws-network/gen/network/v1;networkv1";

// NetworkService owns VPC, subnet, security group, and elastic IP state.
// project_id is required on every call. A mutation requires idempotency_key,
// unique per project, and returns an Operation to poll. The same key and
// request returns the original Operation. The same key with a different
// request is ALREADY_EXISTS. A validation failure is an RPC error and creates
// no Operation. Removing an already-absent target succeeds.
service NetworkService {
  rpc CreateVpc(CreateVpcRequest) returns (Operation);
  rpc DeleteVpc(DeleteVpcRequest) returns (Operation);
  rpc GetVpc(GetVpcRequest) returns (Vpc);
  rpc ListVpcs(ListVpcsRequest) returns (ListVpcsResponse);

  rpc CreateSubnet(CreateSubnetRequest) returns (Operation);
  rpc DeleteSubnet(DeleteSubnetRequest) returns (Operation);
  rpc GetSubnet(GetSubnetRequest) returns (Subnet);
  rpc ListSubnets(ListSubnetsRequest) returns (ListSubnetsResponse);

  rpc CreateSecurityGroup(CreateSecurityGroupRequest) returns (Operation);
  rpc DeleteSecurityGroup(DeleteSecurityGroupRequest) returns (Operation);
  rpc AuthorizeSecurityGroupRules(AuthorizeSecurityGroupRulesRequest) returns (Operation);
  rpc RevokeSecurityGroupRules(RevokeSecurityGroupRulesRequest) returns (Operation);
  rpc GetSecurityGroup(GetSecurityGroupRequest) returns (SecurityGroup);
  rpc ListSecurityGroups(ListSecurityGroupsRequest) returns (ListSecurityGroupsResponse);

  rpc AllocateElasticIp(AllocateElasticIpRequest) returns (Operation);
  rpc ReleaseElasticIp(ReleaseElasticIpRequest) returns (Operation);
  rpc AssociateElasticIp(AssociateElasticIpRequest) returns (Operation);
  rpc DisassociateElasticIp(DisassociateElasticIpRequest) returns (Operation);
  rpc GetElasticIp(GetElasticIpRequest) returns (ElasticIp);
  rpc ListElasticIps(ListElasticIpsRequest) returns (ListElasticIpsResponse);

  rpc GetOperation(GetOperationRequest) returns (Operation);
}

// cidr_block is canonical IPv4, /16 through /28, global unicast, and disjoint
// from other VPC CIDRs in the project.
message CreateVpcRequest {
  string project_id = 1;
  string idempotency_key = 2;
  string cidr_block = 3;
}

// FAILED_PRECONDITION while a subnet, non-default group, or elastic IP remains.
message DeleteVpcRequest {
  string project_id = 1;
  string idempotency_key = 2;
  string vpc_id = 3;
}

// cidr_block is canonical, inside the VPC, from the VPC prefix through /28,
// and disjoint from sibling subnets.
message CreateSubnetRequest {
  string project_id = 1;
  string idempotency_key = 2;
  string vpc_id = 3;
  string cidr_block = 4;
  string availability_zone = 5;
}

// FAILED_PRECONDITION while an elastic IP association names this subnet.
message DeleteSubnetRequest {
  string project_id = 1;
  string idempotency_key = 2;
  string subnet_id = 3;
}

// name is unique within the VPC. The group starts with egress allow-all.
message CreateSecurityGroupRequest {
  string project_id = 1;
  string idempotency_key = 2;
  string vpc_id = 3;
  string name = 4;
}

// FAILED_PRECONDITION for the default group or while another group's rule peers it.
message DeleteSecurityGroupRequest {
  string project_id = 1;
  string idempotency_key = 2;
  string security_group_id = 3;
}

// A duplicate rule tuple adds nothing. Revoking an absent rule succeeds.
message AuthorizeSecurityGroupRulesRequest {
  string project_id = 1;
  string idempotency_key = 2;
  string security_group_id = 3;
  repeated Rule rules = 4;
}

message RevokeSecurityGroupRulesRequest {
  string project_id = 1;
  string idempotency_key = 2;
  string security_group_id = 3;
  repeated Rule rules = 4;
}

// RESOURCE_EXHAUSTED when no pool address outside the project's VPC CIDRs is free.
message AllocateElasticIpRequest {
  string project_id = 1;
  string idempotency_key = 2;
  string vpc_id = 3;
}

// FAILED_PRECONDITION while the address is associated.
message ReleaseElasticIpRequest {
  string project_id = 1;
  string idempotency_key = 2;
  string elastic_ip_id = 3;
}

// private_address is a usable host in a subnet of the elastic IP's VPC.
message AssociateElasticIpRequest {
  string project_id = 1;
  string idempotency_key = 2;
  string elastic_ip_id = 3;
  string private_address = 4;
}

message DisassociateElasticIpRequest {
  string project_id = 1;
  string idempotency_key = 2;
  string elastic_ip_id = 3;
}

message GetVpcRequest {
  string project_id = 1;
  string vpc_id = 2;
}

message GetSubnetRequest {
  string project_id = 1;
  string subnet_id = 2;
}

message GetSecurityGroupRequest {
  string project_id = 1;
  string security_group_id = 2;
}

message GetElasticIpRequest {
  string project_id = 1;
  string elastic_ip_id = 2;
}

message GetOperationRequest {
  string project_id = 1;
  string operation_id = 2;
}

message ListVpcsRequest {
  string project_id = 1;
}

message ListVpcsResponse {
  repeated Vpc vpcs = 1;
}

// vpc_id empty lists the whole project.
message ListSubnetsRequest {
  string project_id = 1;
  string vpc_id = 2;
}

message ListSubnetsResponse {
  repeated Subnet subnets = 1;
}

message ListSecurityGroupsRequest {
  string project_id = 1;
  string vpc_id = 2;
}

message ListSecurityGroupsResponse {
  repeated SecurityGroup security_groups = 1;
}

message ListElasticIpsRequest {
  string project_id = 1;
  string vpc_id = 2;
}

message ListElasticIpsResponse {
  repeated ElasticIp elastic_ips = 1;
}

enum ResourceStatus {
  RESOURCE_STATUS_UNSPECIFIED = 0;
  RESOURCE_STATUS_PENDING = 1;
  RESOURCE_STATUS_AVAILABLE = 2;
  RESOURCE_STATUS_DELETING = 3;
  RESOURCE_STATUS_FAILED = 4;
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_INGRESS = 1;
  DIRECTION_EGRESS = 2;
}

enum Protocol {
  PROTOCOL_UNSPECIFIED = 0;
  PROTOCOL_TCP = 1;
  PROTOCOL_UDP = 2;
  PROTOCOL_ICMP = 3;
  PROTOCOL_ALL = 4;
}

message Vpc {
  string id = 1;
  string project_id = 2;
  string cidr_block = 3;
  string default_security_group_id = 4;
  ResourceStatus status = 5;
}

message Subnet {
  string id = 1;
  string project_id = 2;
  string vpc_id = 3;
  string cidr_block = 4;
  string availability_zone = 5;
  ResourceStatus status = 6;
}

message SecurityGroup {
  string id = 1;
  string project_id = 2;
  string vpc_id = 3;
  string name = 4;
  bool is_default = 5;
  repeated Rule rules = 6;
  ResourceStatus status = 7;
}

message ElasticIp {
  string id = 1;
  string project_id = 2;
  string vpc_id = 3;
  string address = 4;
  string private_address = 5;
  string subnet_id = 6;
  ResourceStatus status = 7;
}

// Identity is direction, protocol, ports, and one peer. TCP and UDP ports are
// 0 through 65535 with from_port <= to_port. ICMP and all use -1. A peer CIDR
// is any canonical IPv4 prefix, including 0.0.0.0/0, or a group in the same VPC.
message Rule {
  Direction direction = 1;
  Protocol protocol = 2;
  int32 from_port = 3;
  int32 to_port = 4;
  oneof peer {
    string cidr_block = 5;
    string security_group_id = 6;
  }
}

// type is the RPC that created the operation. SUCCEEDED means the dataplane
// matches the desired state for this resource. FAILED sets error_message.
message Operation {
  enum State {
    STATE_UNSPECIFIED = 0;
    PENDING = 1;
    RUNNING = 2;
    SUCCEEDED = 3;
    FAILED = 4;
  }
  string id = 1;
  string project_id = 2;
  string type = 3;
  string resource_id = 4;
  State state = 5;
  string error_message = 6;
  string idempotency_key = 7;
}
